<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>SHOP Osaka — Defective Check</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light only;--w:#ffffff;--k:#000000;--g50:#fafafa;--g100:#f5f5f5;--g200:#eeeeee;--g400:#bdbdbd;--g600:#757575;--g800:#424242;--red:#c62828;--redL:#ffebee;--redM:#ef9a9a;--blue:#1565c0;--blueL:#e3f2fd;--green:#2e7d32;--greenL:#e8f5e9;--amber:#e65100;--amberL:#fff3e0;--teal:#00695c;--tealL:#e0f2f1}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light only!important;forced-color-adjust:none!important}
  html,body{height:100%;background:#ffffff!important;font-family:'Montserrat',sans-serif;color:#000000!important}
  @media(prefers-color-scheme:dark){
    html,body{background:#ffffff!important;color:#000000!important}
    .hdr{background:#ffffff!important;border-color:#eeeeee!important}
    .stat{background:#f5f5f5!important}
    .item-name,.ti,.inv-no{color:#000000!important}
    .ey,.inv-ct,.inv-dt,.item-no,.stat-l,.item-code,.up-sub{color:#bdbdbd!important}
    .up-tit{color:#424242!important}
    .sbtn{background:#ffffff!important;color:#757575!important;border-color:#eeeeee!important}
    .sbtn.ok{background:#e8f5e9!important;color:#2e7d32!important;border-color:#2e7d32!important}
    .sbtn.def{background:#ffebee!important;color:#c62828!important;border-color:#c62828!important}
    .sbtn.war{background:#e3f2fd!important;color:#1565c0!important;border-color:#1565c0!important}
    .def-sum{background:#ffebee!important}
    .def-sum-tit,.def-li-rm{color:#c62828!important}
    .def-li-hd,.def-li-no{color:#000000!important}
    .war-sum{background:#e3f2fd!important}
    .war-sum-tit{color:#1565c0!important}
    .war-li{color:#000000!important}
    .alert{background:#fff3e0!important;color:#e65100!important}
    .tag.parts{background:#e0f2f1!important;color:#00695c!important}
    .tag.sun{background:#fff3e0!important;color:#e65100!important}
    .tag.rx{background:#e3f2fd!important;color:#1565c0!important}
    .tag.qty{background:#f5f5f5!important;color:#757575!important}
    .rmk-inp{background:#ffebee!important;color:#c62828!important;border-color:#ef9a9a!important}
    .rawbox{background:#fafafa!important;color:#424242!important}
    .upzone,.nlz{border-color:#bdbdbd!important;background:#ffffff!important}
    .upzone:active,.nlz:active{background:#fafafa!important}
    .sheet,.ef input,.ef textarea,.mfield input,.mrow input{background:#ffffff!important;color:#000000!important;border-color:#eeeeee!important}
    .sheet{background:#ffffff!important}
    .sheet-tit{color:#000000!important}
    .ef label,.mfield label{color:#bdbdbd!important}
    .btn.blk{background:#000000!important;color:#ffffff!important}
    .btn.out{background:#ffffff!important;color:#757575!important;border-color:#eeeeee!important}
    .tab{color:#757575!important}
    .tab.act{color:#000000!important;border-color:#000000!important}
    .tabs{border-color:#eeeeee!important}
    .item{border-color:#f5f5f5!important}
    .prog-bar{background:#eeeeee!important}
    .prog-fill{background:#000000!important}
  }
  .hdr{position:sticky;top:0;z-index:100;background:var(--w);border-bottom:1px solid var(--g200);padding:max(14px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between}
  .ey{font-size:9px;letter-spacing:4px;color:var(--g400)}
  .ti{font-size:13px;font-weight:600;letter-spacing:3px}
  .hdr-acts{display:flex;gap:10px}
  .ibtn{background:none;border:none;cursor:pointer;padding:6px;color:var(--g600);font-size:16px;border-radius:6px}
  .ibtn:active{background:var(--g100)}
  .upzone{margin:28px 20px;border:1px dashed var(--g400);border-radius:4px;padding:44px 20px;text-align:center;cursor:pointer;position:relative;transition:background .15s}
  .upzone:active{background:var(--g50)}
  .upzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .up-icon{font-size:32px;margin-bottom:12px}
  .up-tit{font-size:11px;letter-spacing:3px;color:var(--g800);font-weight:500}
  .up-sub{font-size:10px;color:var(--g400);margin-top:6px;letter-spacing:1px}
  .lbar{height:2px;background:var(--g200);margin:0 20px;border-radius:1px;overflow:hidden}
  .lfill{height:100%;background:var(--k);animation:ld 1.2s ease-in-out infinite}
  @keyframes ld{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
  @keyframes glassespin{from{transform:perspective(120px) rotateY(0deg)}to{transform:perspective(120px) rotateY(360deg)}}
  .glass-spin{animation:glassespin 2s linear infinite;display:block}
  .ltxt{text-align:center;font-size:10px;letter-spacing:2px;color:var(--g600);padding:12px 20px 0}
  .nlz{margin:10px 20px 0;border:1px dashed var(--g200);border-radius:4px;padding:11px 16px;text-align:center;cursor:pointer;position:relative}
  .nlz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .nlz span{font-size:10px;letter-spacing:2px;color:var(--g400)}
  .inv-hdr{padding:20px 20px 0}
  .inv-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:3px}
  .inv-no{font-size:19px;font-weight:500;letter-spacing:1.5px}
  .inv-ct{font-size:10px;color:var(--g400);letter-spacing:1px}
  .inv-dt{font-size:10px;color:var(--g400);letter-spacing:1px}
  .prog-wrap{padding:14px 20px 4px}
  .prog-bar{height:1px;background:var(--g200);border-radius:1px}
  .prog-fill{height:100%;background:var(--k);border-radius:1px;transition:width .4s}
  .stats{display:flex;gap:6px;padding:12px 20px}
  .stat{flex:1;background:var(--g50);border-radius:4px;padding:9px 6px;text-align:center}
  .stat-n{font-size:18px;font-weight:500}
  .stat-l{font-size:9px;letter-spacing:1px;color:var(--g600);margin-top:1px}
  .stat.pend .stat-n{color:var(--g400)}.stat.ok .stat-n{color:var(--green)}.stat.def .stat-n{color:var(--red)}.stat.war .stat-n{color:var(--blue)}
  .tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--g200);overflow-x:auto}
  .tab{flex-shrink:0;padding:10px 14px;font-size:9px;letter-spacing:2px;color:var(--g600);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
  .tab.act{color:var(--k);border-bottom-color:var(--k)}
  .cl{padding:0 20px}
  .item{border-bottom:1px solid var(--g100);padding:11px 0}
  .item-row{display:flex;align-items:center;gap:10px}
  .item-no{min-width:22px;font-size:10px;color:var(--g400);text-align:right;font-weight:500}
  .item-body{flex:1;min-width:0}
  .item-tags{display:flex;gap:5px;margin-bottom:3px;align-items:center}
  .tag{font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:2px;font-weight:500}
  .tag.parts{background:var(--tealL);color:var(--teal)}.tag.sun{background:var(--amberL);color:var(--amber)}.tag.rx{background:var(--blueL);color:var(--blue)}.tag.qty{background:var(--g100);color:var(--g600)}
  .item-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-code{font-size:10px;color:var(--g600);font-family:monospace;letter-spacing:.5px;margin-top:1px}
  .sbtn{flex-shrink:0;min-width:64px;padding:8px 4px;border:1px solid var(--g200);font-size:9px;letter-spacing:1.5px;font-weight:600;border-radius:3px;cursor:pointer;font-family:inherit;background:var(--w);color:var(--g600);user-select:none}
  .sbtn:active{opacity:.7}
  .sbtn.ok{background:var(--greenL);color:var(--green);border-color:var(--green)}
  .sbtn.def{background:var(--redL);color:var(--red);border-color:var(--red)}
  .sbtn.war{background:var(--blueL);color:var(--blue);border-color:var(--blue)}
  .rmk-row{margin-top:10px;margin-left:32px}
  .rmk-inp{width:100%;padding:8px 12px;border:1px solid var(--redM);border-radius:3px;font-size:12px;font-family:inherit;background:var(--redL);color:var(--red);outline:none}
  .rmk-inp::placeholder{color:var(--redM)}
  .def-sum{margin:16px 20px;background:var(--redL);border-radius:4px;padding:16px}
  .def-sum-tit{font-size:9px;letter-spacing:3px;color:var(--red);font-weight:600;margin-bottom:14px}
  .def-li{margin-bottom:10px}
  .def-li-hd{font-size:12px;font-weight:500}
  .def-li-no{color:var(--g400);margin-right:5px;font-size:11px}
  .def-li-rm{font-size:11px;color:var(--red);margin-top:2px}
  .war-sum{margin:16px 20px;background:var(--blueL);border-radius:4px;padding:16px}
  .war-sum-tit{font-size:9px;letter-spacing:3px;color:var(--blue);font-weight:600;margin-bottom:14px}
  .war-li{font-size:12px;margin-bottom:6px;display:flex;gap:8px}
  .war-li-no{color:var(--g400);min-width:24px;text-align:right}
  .btn{width:100%;padding:13px;border:none;cursor:pointer;font-size:10px;letter-spacing:3px;font-weight:500;font-family:inherit;border-radius:3px;margin-top:12px}
  .btn.blk{background:var(--k);color:var(--w)}.btn.blk:active{opacity:.8}
  .btn.out{background:var(--w);color:var(--g600);border:1px solid var(--g200);margin-top:8px}.btn.out:active{background:var(--g50)}
  .alert{margin:0 20px 16px;padding:12px 14px;background:var(--amberL);border-radius:4px;font-size:11px;color:var(--amber);letter-spacing:.3px}
  .mpanel{margin:0 20px 20px}
  .mpanel h3{font-size:10px;letter-spacing:3px;color:var(--g600);margin-bottom:12px;font-weight:500}
  .mfield{margin-bottom:12px}
  .mfield label{font-size:9px;letter-spacing:2px;color:var(--g400);display:block;margin-bottom:4px}
  .mfield input{width:100%;padding:9px 12px;border:1px solid var(--g200);border-radius:3px;font-size:12px;font-family:monospace;background:var(--w);color:var(--k);outline:none}
  .mfield input:focus{border-color:var(--k)}
  .mrow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .mrow input{padding:8px 10px;border:1px solid var(--g200);border-radius:3px;font-size:12px;font-family:monospace;outline:none;background:var(--w);color:var(--k)}
  .mrow input:focus{border-color:var(--k)}
  .fn{width:44px!important}.fc{width:100px!important}.fd{flex:1}
  .delbtn{background:none;border:none;cursor:pointer;color:var(--g400);font-size:18px;padding:2px;flex-shrink:0}
  details.raw{margin:0 20px 16px}
  details.raw summary{font-size:10px;letter-spacing:2px;color:var(--g600);cursor:pointer;padding:10px 0;list-style:none}
  details.raw summary::-webkit-details-marker{display:none}
  .rawbox{background:var(--g50);border:1px solid var(--g200);padding:10px;font-size:10px;font-family:monospace;white-space:pre-wrap;max-height:180px;overflow-y:auto;color:var(--g800);border-radius:3px;margin-top:6px}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;touch-action:none;overscroll-behavior:none}
  .sheet{background:var(--w);width:100%;border-radius:12px 12px 0 0;padding:20px 20px max(20px,env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;overscroll-behavior:contain}
  .sheet-tit{font-size:11px;letter-spacing:3px;font-weight:600;margin-bottom:16px}
  .close-btn{float:right;background:none;border:none;cursor:pointer;color:var(--g400);font-size:22px;line-height:1}
  .ef{margin-bottom:13px}
  .ef label{font-size:9px;letter-spacing:2px;color:var(--g400);display:block;margin-bottom:5px}
  .ef input,.ef textarea{width:100%;padding:10px 12px;border:1px solid var(--g200);border-radius:3px;font-size:12px;font-family:inherit;background:var(--w);color:var(--k);outline:none;resize:vertical}
  .ef textarea{min-height:190px}
  .eacts{display:flex;gap:10px;margin-top:12px}
  .eacts .btn{margin-top:0}
  .eacts .btn.s{flex-shrink:0;width:auto;padding:13px 16px;font-size:10px}
  .bot{height:max(60px,env(safe-area-inset-bottom))}
  .fab{position:fixed;bottom:28px;right:20px;width:44px;height:44px;border-radius:50%;background:#000;color:#fff;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:200}
  .fab:active{opacity:.7}
  /* DEFECT PICKER */
  .dpick{margin-top:10px;margin-left:32px;background:#fff8f8;border:1px solid var(--redM);border-radius:6px;padding:12px 14px}
  .dpick-row{margin-bottom:10px}
  .dpick-row:last-child{margin-bottom:0}
  .dpick-label{font-size:9px;letter-spacing:2px;color:var(--red);font-weight:600;margin-bottom:7px}
  .dpick-pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{padding:5px 11px;border-radius:999px;border:1px solid var(--redM);font-size:11px;font-weight:500;
    cursor:pointer;background:#fff;color:var(--red);user-select:none;transition:background .1s}
  .pill:active{opacity:.7}
  .pill-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
  .pill-tip{font-size:8px;color:var(--redM);letter-spacing:.3px;white-space:nowrap}
  .pill-wrap .pill.sel+.pill-tip{color:var(--red)}
  .pill.sel{background:var(--red);color:#fff;border-color:var(--red)}
  .pill-other{padding:5px 11px;border-radius:999px;border:1px dashed var(--redM);font-size:11px;
    cursor:pointer;background:#fff;color:var(--redM);user-select:none}
  .pill-other.sel{border-style:solid;color:var(--red)}
  .dpick-other-input{margin-top:8px}
  .dpick-other-input input{width:100%;padding:7px 11px;border:1px solid var(--redM);border-radius:20px;
    font-size:12px;font-family:inherit;background:#fff;color:var(--red);outline:none}
  .dpick-other-input input::placeholder{color:var(--redM)}
  .dpick-entry{margin-bottom:0}
  .dpick-entry-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dpick-entry-num{font-size:9px;letter-spacing:2px;color:var(--redM);font-weight:600}
  .dpick-del{background:none;border:none;cursor:pointer;font-size:10px;color:var(--redM);font-family:inherit;padding:2px 0;letter-spacing:.5px}
  .dpick-del:active{color:var(--red)}
  .dpick-divider{height:1px;background:var(--redM);opacity:.3;margin:12px 0}
  .dpick-add{width:100%;margin-top:12px;padding:8px;background:none;border:1px dashed var(--redM);border-radius:4px;color:var(--red);font-size:10px;letter-spacing:2px;font-weight:600;cursor:pointer;font-family:inherit}
  .dpick-add:active{background:var(--redL)}
  @media(prefers-color-scheme:dark){
    .dpick{background:#fff8f8!important;border-color:var(--redM)!important}
    .pill{background:#fff!important;color:var(--red)!important}
    .pill.sel{background:var(--red)!important;color:#fff!important}
    .dpick-other-input input{background:#fff!important;color:var(--red)!important}
  }
  .grp-hdr{padding:12px 0 6px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--g200);margin-top:4px}
  .grp-hdr-name{font-size:12px;font-weight:500}
  .grp-hdr-code{font-size:10px;color:var(--g600);font-family:monospace;letter-spacing:.5px}
  .grp-hdr-tags{display:flex;gap:5px;align-items:center;margin-left:auto}
  .sub-item{border-bottom:1px solid var(--g100);padding:10px 0 10px 32px}
  .sub-item-row{display:flex;align-items:center;gap:10px}
  .sub-idx{min-width:32px;font-size:10px;color:var(--g400);text-align:right;font-weight:500}
  .sub-bar{width:2px;background:var(--g200);border-radius:1px;align-self:stretch;flex-shrink:0;margin-right:2px}
  .def-inline{display:flex;align-items:baseline;gap:6px;margin-top:4px;margin-left:32px;cursor:pointer}
  .def-inline-txt{font-size:10px;color:var(--red);font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .def-inline-edit{font-size:9px;letter-spacing:1.5px;color:var(--redM);flex-shrink:0;padding:2px 6px;border:1px solid var(--redM);border-radius:3px;background:none;cursor:pointer;font-family:inherit;font-weight:500}
  .def-inline-edit:active{background:var(--redL)}
  .def-inline-empty{font-size:10px;color:var(--redM);font-style:italic}
  /* STAMP SCREEN */
  .stamp-card{margin:0 20px 12px;border:1px solid var(--g200);border-radius:6px;padding:14px 16px}
  .stamp-card-hd{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .stamp-pos{font-size:10px;color:var(--g400);font-weight:500;min-width:28px}
  .stamp-name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stamp-remark{font-size:10px;color:var(--red);margin-bottom:10px;padding-left:36px}
  .stamp-field label{font-size:9px;letter-spacing:2px;color:var(--g400);display:block;margin-bottom:5px}
  .stamp-inp{width:100%;padding:10px 14px;border:1px solid var(--g200);border-radius:4px;
    font-size:14px;font-family:monospace;letter-spacing:1px;background:var(--w);color:var(--k);outline:none}
  .stamp-inp:focus{border-color:var(--k)}
  .stamp-inp.filled{border-color:var(--green);background:var(--greenL);color:var(--green)}
  @media(prefers-color-scheme:dark){
    .stamp-card{background:#fff!important;border-color:#eee!important}
    .stamp-inp{background:#fff!important;color:#000!important}
    .stamp-inp.filled{background:var(--greenL)!important;color:var(--green)!important}
  }
  /* HOME SCREEN */
  .home-new{display:block;width:calc(100% - 40px);margin:16px 20px 0;border:1px dashed var(--g400);border-radius:4px;padding:14px;text-align:center;cursor:pointer;font-size:10px;letter-spacing:2px;color:var(--g600);background:none}
  .home-new:active{background:var(--g50)}
  .home-sec{padding:16px 20px 6px;font-size:9px;letter-spacing:3px;color:var(--g400);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px}
  /* SWIPE CARD */
  .inv-swipe-wrap{position:relative;overflow:hidden;margin:0 20px 10px;border-radius:6px}
  .inv-swipe-left{position:absolute;left:0;top:0;bottom:0;display:flex}
  .inv-swipe-right{position:absolute;right:0;top:0;bottom:0;display:flex}
  .isw-btn{display:flex;align-items:center;justify-content:center;padding:0 14px;font-size:9px;letter-spacing:1.5px;font-weight:600;border:none;cursor:pointer;color:#fff;font-family:inherit;white-space:nowrap}
  .isw-btn.isw-mail{background:var(--blue)}
  .isw-btn.isw-csv{background:var(--teal)}
  .isw-btn.isw-sent{background:var(--g300);color:var(--g700)}
  .isw-btn.isw-sent.on{background:var(--blue);color:#fff}
  .isw-btn.isw-arc{background:var(--g800)}
  .isw-btn.isw-restore{background:var(--green)}
  .isw-btn.isw-del{background:var(--red)}
  @keyframes disp-hop{0%{transform:translateY(0)}20%{transform:translateY(-9px)}40%{transform:translateY(-2px)}60%{transform:translateY(-6px)}80%{transform:translateY(-1px)}100%{transform:translateY(0)}}
  .disp-hop{animation:disp-hop 0.7s ease;}
  @keyframes pn-blink{0%,100%{opacity:1}50%{opacity:0.25}}
  .pn-badge{animation:pn-blink 1.2s ease-in-out infinite;font-size:8px;letter-spacing:.5px;font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:3px;padding:1px 5px}
  .pu-badge{font-size:8px;letter-spacing:.5px;font-weight:700;color:#9333ea;border:1px solid #9333ea;border-radius:3px;padding:1px 5px}
  .sc-badge{font-size:8px;letter-spacing:.5px;font-weight:700;color:#d97706;border:1px solid #d97706;border-radius:3px;padding:1px 5px}
  .sb-badge{font-size:8px;letter-spacing:.5px;font-weight:700;color:#dc2626;border:1px solid #dc2626;border-radius:3px;padding:1px 5px}
  .dnp-badge{font-size:8px;letter-spacing:.5px;font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:3px;padding:1px 5px}
  @keyframes proc-step-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes proc-line-in{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes guide-swipe{0%,12%{transform:translateX(0);opacity:1;animation-timing-function:ease-in}40%,65%{transform:translateX(-156px);opacity:1}66%,100%{transform:translateX(0);opacity:0}}
  @keyframes guide-sent-show{0%,14%{opacity:0}32%,64%{opacity:1}66%,100%{opacity:0}}

function _autoSetRece(items,invNumber){
  if(!items.length)return;
  const _pnMap=buildPnMap();
  const om=buildOrderNoMap();
  // Collect unique pnKeys from replacement items being marked OK (skip DS/SB)
  const pnKeys=new Set();
  for(const it of items){
    const k=(it.orderNo||'').trim();
    if(!k||!_pnMap.has(k))continue;
    const tag=getDnpSc(k,om);
    if(tag!=='DS'&&tag!=='SB')pnKeys.add(k);
  }
  if(!pnKeys.size)return;
  const toSave={};
  const allInvs={};
  loadList().forEach(e=>{try{const d=localStorage.getItem('mykita_dc_inv_'+e.id);if(!d)return;const inv=JSON.parse(d);allInvs[e.id]=inv;}catch(x){}});
  for(const pnKey of pnKeys){
    const defCands=_pnMap.get(pnKey)||[];
    for(const {invId:tId,no} of defCands){
      if(!allInvs[tId])continue;
      if(!toSave[tId])toSave[tId]=JSON.parse(JSON.stringify(allInvs[tId]));
      const tItem=toSave[tId].items.find(i=>i.no===no);
      if(!tItem||tItem.receiving)continue;
      // Use process chain to find which invoice this defective item's replacement came from
      const chain=buildProcessChain(tId,no);
      if(!chain)continue;
      // Find the delivery step immediately before the final ok/ok_receiving
      let deliveryInvNumber=null;
      for(let i=chain.steps.length-1;i>=0;i--){
        if(chain.steps[i].type==='ok_receiving'||chain.steps[i].type==='ok'){
          for(let j=i-1;j>=0;j--){
            if(chain.steps[j].type==='delivery'){deliveryInvNumber=chain.steps[j].invNumber;break;}
          }
          break;
        }
      }
      if(!deliveryInvNumber)continue;
      toSave[tId].items=toSave[tId].items.map(i=>i.no!==no?i:{...i,receiving:true,receivingDate:deliveryInvNumber});
    }
  }
  if(!Object.keys(toSave).length)return;
  const list=loadList();
  for(const [invId,inv] of Object.entries(toSave)){
    localStorage.setItem('mykita_dc_inv_'+invId,JSON.stringify(inv));
    const idx=list.findIndex(e=>e.id===invId);
    if(idx>=0)list[idx].receCount=inv.items.filter(it=>it.status==='defective'&&it.receiving).length;
  }
  saveList(list);
}
function autoFillPutInStockRece(){

  const toSave={};

      const last=chain.steps[chain.steps.length-1];
      if(!last||!['ok','ok_receiving'].includes(last.type))continue;
      // find delivery step immediately before the final ok/ok_receiving
      let deliveryInvNumber=null;
      for(let i=chain.steps.length-1;i>=0;i--){

  render();
}

function buildProcessChain(rootInvId,rootItemNo){
  const allInvs={};
  loadList().forEach(e=>{try{const d=localStorage.getItem('mykita_dc_inv_'+e.id);if(!d)return;const inv=JSON.parse(d);allInvs[e.id]={...inv,items:inv.items.map(it=>{const patch=_pnListChanges[e.id+'|'+it.no];return patch?{...it,...patch}:it;})};}catch(x){}});
  const steps=[];
  const _visited=new Set();
  let _chainSlot=0;
  function _sortByPos(arr){return arr.sort((a,b)=>{const an=parseFloat(a.subOf||a.no)||0,bn=parseFloat(b.subOf||b.no)||0;return an-bn||(a.subIdx||0)-(b.subIdx||0);});}
  function traverse(invId,item,depth){
    const inv=allInvs[invId];if(!inv)return;
    const _vk=invId+'|'+item.no;if(_visited.has(_vk)||depth>10)return;_visited.add(_vk);
    steps.push({type:depth===0?'order':'delivery',invNumber:inv.number||invId,cat:item.cat,name:item.name,no:item.subOf||item.no});
    if(item.status==='defective'){
      const _isMissing=(item.defects||[]).some(d=>(d.cond||[]).includes('Missing'));
      steps.push({type:'defective',missing:_isMissing});
      if(item.pn)steps.push({type:'pn',pn:item.pn});
      if(item.pn){
        const _cands=[];
        for(const[cId,cInv]of Object.entries(allInvs)){
          if(cId===invId)continue;
          const _ms=_sortByPos(cInv.items.filter(it=>it.orderNo&&it.orderNo.trim()===item.pn.trim()));
          if(_ms[_chainSlot]!=null)_cands.push({cId,cInv,child:_ms[_chainSlot]});
        }
        _cands.sort((a,b)=>(parseInt(a.cInv.number||a.cId)||0)-(parseInt(b.cInv.number||b.cId)||0));
        if(_cands.length)traverse(_cands[0].cId,_cands[0].child,depth+1);
        else steps.push({type:'pending'});
      }
    }else if(item.status==='ok'){
      steps.push({type:'ok_receiving',invNumber:inv.number||invId});
    }else{
      steps.push({type:'pending'});
    }
  }
  const rootInv=allInvs[rootInvId];if(!rootInv)return null;
  const rootItem=rootInv.items.find(i=>i.no===rootItemNo);if(!rootItem)return null;
  const _rootKey=((rootItem.pn||rootItem.orderNo)||'').trim();
  if(_rootKey){const _peers=_sortByPos(rootInv.items.filter(it=>(it.pn||'').trim()===_rootKey||(it.orderNo||'').trim()===_rootKey));const _fi=_peers.findIndex(it=>it.no===rootItemNo);if(_fi>=0)_chainSlot=_fi;}
  traverse(rootInvId,rootItem,0);
  return{steps,title:rootItem.name+(rootItem.colorCode?' #'+rootItem.colorCode:'')};
}

function parseMsgForPns(raw){
  const blocks=raw.split(/Position\s+Number\/Item\s*:/i);
  const results=[];
  for(let i=1;i<blocks.length;i++){
    const block=blocks[i];
    const posMatch=block.match(/^(?:\s|<[^>]+>|&nbsp;)*(\d+)\./);
    if(!posMatch)continue;
    const pos=posMatch[1];
    const pnMatch=block.match(/[Rr]eplacement[\s\S]{0,400}?<b[^>]*>\s*(\d{6,7})\s*<\/b>/i);
    const claimMatch=block.match(/postal\s+claim[:\s]+(?:<[^>]+>)*\s*(\d{5,12})/i);
    const pn=pnMatch?pnMatch[1]:'';
    const claimNo=claimMatch?claimMatch[1]:'';
    const isReturn=/please\s+return\b/i.test(block)||/Replacement\s+Order\s+Number\s*:\s*(?:<[^>]+>|&nbsp;|\s)*NONE\b/i.test(block);
    if(pn||claimNo||isReturn)results.push({pos,pn,claimNo,disp:isReturn?'return':''});
  }
  return results;
}
function extractPdfNamesFromMsg(bytes){
  // PDF attachment filenames are stored as UTF-16LE in .msg binary
  const names=new Set();
  for(let i=0;i+1<bytes.length;i+=2){
    let s='';
    for(let j=i;j+1<bytes.length;j+=2){
      const c=bytes[j]|(bytes[j+1]<<8);
      if(c>=32&&c<=126)s+=String.fromCharCode(c);
      else break;
    }
    const m=s.match(/^([\w\-]{4,40}\.pdf)$/i);
    if(m)names.add(m[1].replace(/\.pdf$/i,''));
  }
  return names;
}
async function handleMsgUpload(f){
  if(!f||!_dispSheet)return;
  try{
    const buf=await f.arrayBuffer();
    const bytes=new Uint8Array(buf);
    let raw='';
    for(let i=0;i<bytes.length;i++){const b=bytes[i];raw+=(b>=32&&b<=126||b===9||b===10||b===13)?String.fromCharCode(b):' ';}
    const pdfNames=extractPdfNamesFromMsg(bytes);
    const mappings=parseMsgForPns(raw);
    if(!mappings.length){alert('RPNマッピングが見つかりませんでした。\nファイルを確認してください。');return;}
    // claim番号が添付PDFファイル名と一致 → Return
    mappings.forEach(m=>{if(m.claimNo&&pdfNames.has(m.claimNo))m.disp='return';});
    const lines=mappings.map(m=>`Pos ${m.pos}${m.pn?' → PN: '+m.pn:''}${m.disp==='return'?' [Return]':''}`).join('\n');
    if(!confirm('以下の内容を自動入力します:\n\n'+lines+'\n\nOK = 適用\nキャンセル = 中止'))return;
    _dispSheet.inv.items=_dispSheet.inv.items.map(it=>{
      const match=mappings.find(m=>it.no===m.pos||it.subOf===m.pos||it.no.startsWith(m.pos+'-'));
      if(!match)return it;
      const update={...it};
      if(match.pn)update.pn=match.pn;
      if(match.disp)update.disp=match.disp;
      return update;
    });
    render();
  }catch(e){alert('.msg/.emlファイルの読み込みエラー: '+e.message);}
}

function getDnpSc(pn,orderNoMap){
  if(!pn||!orderNoMap[pn])return null;

    const cr=(m.custRef||'').toLowerCase();
    if(cr.includes('shop breakage'))return'SB';
    if(cr.includes('def stock')||cr.includes('stock claim'))return'DS';
    if(cr.includes('def')){
      if(cr.includes('new')||cr.includes('prod'))return'DNP';

    }

function _downloadCSV(fname,rows){

function collectReceItems(targetInvNumber){
  const list=loadList();
  const items=[];
  for(const e of list){
    try{
      const d=localStorage.getItem('mykita_dc_inv_'+e.id);if(!d)continue;
      const inv=JSON.parse(d);if(!inv.number)continue;
      inv.items.forEach(it=>{
        if(it.status==='defective'&&it.receiving&&it.receivingDate===targetInvNumber&&(it.cat==='rx'||it.cat==='sun')){
          items.push({it,invNumber:inv.number,invId:e.id});
        }
      });
    }catch(x){}
  }
  console.log('[collectReceItems] target='+targetInvNumber+' found='+items.length,(items.map(r=>r.invNumber+'-'+r.it.no+' cat='+r.it.cat+' rd='+r.it.receivingDate)));
  return items;
}
function _appendReceToRows(rows,receItems,partsOrderNos){
  const g=new Map();
  receItems.forEach(({it,invNumber})=>{
    const _ext=!(partsOrderNos&&it.pn&&partsOrderNos.has(it.pn.trim()));
    const _base=`Replace from ${invNumber}-${it.subOf||it.no}`;
    const _cat=_ext?it.cat.toUpperCase():`${it.cat.toUpperCase()}→PARTS`;
    if(!g.has(it.itemNo))g.set(it.itemNo,{count:0,name:it.name,posNo:it.subOf||it.no,colorCode:it.colorCode||'',note:_ext?`現INV外 / ${_base}`:_base,cat:_cat});
    const _ge=g.get(it.itemNo);
    _ge.count++;
    {const _tag=_getDefReplaceTag(it.custRef);if(_tag)_ge.note=_ext?`現INV外 / ${_tag} / ${_base}`:`${_tag} / ${_base}`;}
  });
  for(const [itemNo,{count,name,posNo,colorCode,note,cat}] of g){
    rows.push([itemNo,count,'',posNo,name,colorCode,note,cat]);
  }
}
function _findPartsRoot(orderNo,_pnMap){
  const cands=_pnMap.get(orderNo)||[];
  const roots=[];
  for(const {invId,invNumber,no} of cands){
    try{
      const d=localStorage.getItem('mykita_dc_inv_'+invId);if(!d)continue;
      const inv=JSON.parse(d);
      const item=inv.items.find(it=>it.no===no);
      if(item&&(item.cat==='rx'||item.cat==='sun'))roots.push({item,invNumber,invId});
    }catch(x){}
  }
  return roots.length===1?roots[0]:null;
}

    if(!d)return;
    try{

        if((it.cat==='rx'||it.cat==='sun')&&it.status==='ok'&&!it.smDone){
          if(!grouped.has(it.itemNo))grouped.set(it.itemNo,{count:0,name:it.name,posNo:it.subOf||it.no,colorCode:it.colorCode||'',note:'',cat:it.cat.toUpperCase()});

          {const _tag=_getDefReplaceTag(it.custRef);if(_tag){const _src=it.orderNo?(_pnMap.get(it.orderNo.trim())||[]):[];_ge.note=_src.length===1?`${_tag} / Replace from ${_src[0].invNumber}-${_src[0].no}`:_tag;}}

        }
      });

          _currentPartsOrderNos.add(it.orderNo.trim());

        }
      });
    }catch(e){}
  });

  }

    if(confirm('CustRefに以下のいずれかが含まれているアイテムが存在します。\n[def stock / stock claim / shop breakage / PU / Personal Order]\n\n'+_wl+'\n\n今回入庫させないよう、入庫CSVから除外しますか？\n\nOK = 除外する\nキャンセル = そのまま続行')){
      const _excl=new Set(_dsSbWarnItems.map(w=>w.itemNo));
      const _kept=rows.filter(r=>!_excl.has(r[0]));
      rows.length=0;_kept.forEach(r=>rows.push(r));
      const _exclByInv={};
      _dsSbWarnItems.forEach(w=>{if(!_exclByInv[w.invId])_exclByInv[w.invId]=new Set();_exclByInv[w.invId].add(w.itemNo);});

      }
    }
  }

  }

      const rk=rootItem.itemNo;

    _receAdded=true;
  }
  // Unresolved PARTS: warn (only when RECE was added or no RECE items)

  if(typeof Encoding==='undefined'){alert('Encoding library not loaded. Please reload the page.');return;}

    }
    // Resolved PARTS: automatically add with root item data (no warning)
    if(_partsResolved.length){
      const _rpg=new Map();

        const rk=rootItem.itemNo;

      _receAdded=true;
    }
    // Unresolved PARTS: warn
    if(!rows.length){alert('No data to export.');return;}
    if(typeof Encoding==='undefined'){alert('Encoding library not loaded. Please reload the page.');return;}
    const csvText=['商品コード,検品数,原価（税抜）,行番号,商品名,カラー番号,その他,カテゴリ',..._applySmMask(rows).map(r=>r.join(','))].join('\r\n');
    const arr=Encoding.convert(Encoding.stringToCode(csvText),'SJIS','UNICODE');

    const url=URL.createObjectURL(blob);

    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    // Mark this invoice as smExported in list
    const _list=loadList();const _idx=_list.findIndex(e=>e.id===id);
    if(_idx>=0&&!_list[_idx].smExported){_list[_idx].smExported=true;saveList(_list);}
    S.showCsvPicker=false;S.csvPickerId=null;render();

function _swGetXY(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
function _swGetEndXY(e){return e.changedTouches?{x:e.changedTouches[0].clientX}:{x:e.clientX};}
function swStart(e,id){
  if(e.button&&e.button!==0)return;
  if(_sw.openId&&_sw.openId!==id){
    const prev=document.querySelector(`.inv-swipe-wrap[data-id="${_sw.openId}"] .inv-card`);
    if(prev){prev.style.transition='transform .2s ease';prev.style.transform='translateX(0)';}
    _sw.openId=null;_sw.openDir=null;
  }
  const wrap=e.currentTarget;
  const el=wrap.querySelector('.inv-card');
  const actLeft=wrap.querySelector('.inv-swipe-left');
  const actRight=wrap.querySelector('.inv-swipe-right');
  const {x,y}=_swGetXY(e);
  const initOffset=_sw.openId===id?(_sw.openDir==='right'?actLeft.offsetWidth:-(actRight.offsetWidth)):0;
  _sw.state={el,actLeft,actRight,id,startX:x,startY:y,started:false,initOffset,dir:null,isMouse:!e.touches};
}
function swMove(e){
  const s=_sw.state;if(!s)return;
  const {x,y}=_swGetXY(e);
  const dx=x-s.startX,dy=y-s.startY;
  if(!s.started){
    if(Math.abs(dx)<4&&Math.abs(dy)<4)return;
    if(!s.isMouse&&Math.abs(dy)>=Math.abs(dx)){_sw.state=null;return;}
    s.started=true;
    s.dir=_sw.openId===s.id?_sw.openDir:(dx>0?'right':'left');
  }
  e.preventDefault();
  const raw=s.initOffset+dx;
  s.el.style.transition='none';
  if(s.dir==='right'){
    const aw=s.actLeft.offsetWidth;
    s.el.style.transform=`translateX(${Math.min(aw,Math.max(0,raw))}px)`;
  }else{
    const aw=s.actRight.offsetWidth;
    s.el.style.transform=`translateX(${Math.max(-aw,Math.min(0,raw))}px)`;
  }
}
function swEnd(e){
  const s=_sw.state;_sw.state=null;
  if(!s||!s.started)return;
  _sw.moved=true;setTimeout(()=>{_sw.moved=false;},300);
  const {x}=_swGetEndXY(e);
  const dx=x-s.startX+s.initOffset;
  s.el.style.transition='transform .2s ease';
  if(s.dir==='right'){
    const aw=s.actLeft.offsetWidth;
    if(dx>(aw*0.3)){s.el.style.transform=`translateX(${aw}px)`;_sw.openId=s.id;_sw.openDir='right';}
    else{s.el.style.transform='translateX(0)';_sw.openId=null;_sw.openDir=null;}
  }else{
    const aw=s.actRight.offsetWidth;
    if(dx<-(aw*0.3)){s.el.style.transform=`translateX(-${aw}px)`;_sw.openId=s.id;_sw.openDir='left';}
    else{s.el.style.transform='translateX(0)';_sw.openId=null;_sw.openDir=null;}
  }
}

async function _gFetch(url,opts={}){
  if(location.protocol==='file:')throw new Error('file://では外部APIにアクセスできません。HTTPSで配信してください');
  const pat=gPat();
  let res;
  try{
    res=await fetch(url,{...opts,cache:'no-store',headers:{'Content-Type':'application/json',...(pat?{'Authorization':'token '+pat}:{}),...(opts.headers||{})}});
  }catch(fe){
    throw new Error('ネットワークエラー（GitHubへ到達できません）: '+fe.message+' — インターネット接続・VPN・ファイアウォールをご確認ください');
  }
  if(!res.ok){let msg='HTTP '+res.status;try{const e=await res.clone().json();if(e.message)msg=e.message;}catch(x){}throw new Error(msg);}
  return res.json();
}
async function _gistDoPull(){
  const pat=gPat(),id=gId();
  if(!pat||!id)throw new Error('Token/ID未設定');
  const data=await _gFetch('https://api.github.com/gists/'+id+'?_t='+Date.now());
  // getC: fetch file content; truncated→try raw_url without auth (avoids CORS preflight on gist.githubusercontent.com), then with auth
  const getC=async fi=>{
    if(!fi.truncated)return fi.content||null;
    try{const r=await fetch(fi.raw_url);if(r.ok)return await r.text();}catch(e){}
    try{return await fetch(fi.raw_url,{headers:{'Authorization':'token '+pat}}).then(r=>r.text());}
    catch(fe){
      console.warn('raw fetch failed (file >1MB, raw_url blocked):',fi.raw_url,fe.message);
      return null;  // fi.content is truncated partial JSON — do NOT parse it
    }
  };
  _gistPulling=true;
  let _skipped=[];
  try{
    let _listFromFile=false;
    if(data.files['list.json']){
      const c=await getC(data.files['list.json']);
      if(c){saveList(JSON.parse(c));_listFromFile=true;}
      else _skipped.push('list');
    }
    const _invLoaded={};
    for(const fn of Object.keys(data.files)){
      if(fn.startsWith('inv_')&&fn.endsWith('.json')){
        const c=await getC(data.files[fn]);
        if(c){const iid=fn.slice(4,-5);localStorage.setItem('mykita_dc_inv_'+iid,c);_invLoaded[iid]=c;}
        else _skipped.push(fn);
      }
    }
    // If list.json was unavailable (>1MB), rebuild list from inv_ files
    if(!_listFromFile&&Object.keys(_invLoaded).length>0){
      const localList=loadList();
      const localById={};localList.forEach(e=>localById[e.id]=e);
      const seen=new Set();const newList=[];
      for(const e of localList){
        if(_invLoaded[e.id]){
          const inv=JSON.parse(_invLoaded[e.id]);
          const defItems=inv.items.filter(i=>i.status==='defective');
          newList.push({id:e.id,number:inv.number||e.number,date:inv.date||e.date,createdAt:e.createdAt,archived:e.archived,tot:inv.items.length,pend:inv.items.filter(i=>i.status==='pending').length,dispTotal:defItems.length,dispSet:defItems.filter(i=>i.pn).length,receCount:defItems.filter(i=>i.receiving).length,updatedAt:e.updatedAt});
        }else{newList.push(e);}
        seen.add(e.id);
      }
      for(const[iid,c]of Object.entries(_invLoaded)){
        if(!seen.has(iid)){
          const inv=JSON.parse(c);
          const defItems=inv.items.filter(i=>i.status==='defective');
          newList.unshift({id:iid,number:inv.number||'',date:inv.date||'',createdAt:inv.createdAt||new Date().toISOString(),archived:false,tot:inv.items.length,pend:inv.items.filter(i=>i.status==='pending').length,dispTotal:defItems.length,dispSet:defItems.filter(i=>i.pn).length,receCount:defItems.filter(i=>i.receiving).length});
        }
      }
      saveList(newList);
      _skipped=_skipped.filter(s=>s!=='list');
    }
    // Repo設定を他デバイスへ自動反映・写真同期（エラーがあってもインボイス表示をブロックしない）
    try{
      if(data.files['settings.json']){
        const c=await getC(data.files['settings.json']);
        if(c){try{const st=JSON.parse(c);if(st.repo&&!gRepo())localStorage.setItem(GK_REPO,st.repo);}catch(e){}}
      }
    }catch(pe){console.warn('Pull error (non-fatal):',pe);}
    _markClean();
  }finally{
    _gistPulling=false;
  }
  localStorage.setItem(GK_AT,new Date().toISOString());
  if(S.invoiceId){const d=localStorage.getItem('mykita_dc_inv_'+S.invoiceId);if(d){const inv=JSON.parse(d);inv.items=inv.items.map(migrateItem);S.invoice=inv;}}
  const _loadedInvs=Object.keys(data.files).filter(fn=>fn.startsWith('inv_')&&fn.endsWith('.json')&&!_skipped.includes(fn)).length;
  const _diagParts=['Gist: '+id.slice(0,8)+'…','ファイル: '+Object.keys(data.files).length+'個','インボイス: '+_loadedInvs+'件'];
  if(_skipped.length)_diagParts.push('スキップ: '+_skipped.join(', '));
  _syncMsg='Pull完了 ('+_diagParts.join(' / ')+')';
}
async function gistPush(){
  if(!gPat()){alert('GitHub Personal Access Tokenを設定してください');return;}
  S.pushing=true;_syncSt='push';_syncMsg='';render();
  try{
    const list=loadList();
    const gistId=gId();
    const invFiles={};
    list.forEach(e=>{const d=localStorage.getItem('mykita_dc_inv_'+e.id);if(d)invFiles['inv_'+e.id+'.json']={content:d};});
    // Step2: リマートのlist.jsonと合算（他デバイスのインボイスを消さない）—失敗しても続行
    let mergedList=[...list];
    let _cur=null;
    if(gistId){
      try{
        _cur=await _gFetch('https://api.github.com/gists/'+gistId+'?_t='+Date.now());
        const lf=_cur.files['list.json'];
        if(lf){
          const rc=lf.truncated?await fetch(lf.raw_url,{headers:{'Authorization':'token '+gPat()}}).then(r=>r.text()):lf.content;
          if(rc){const remoteList=JSON.parse(rc);const localIds=new Set(list.map(e=>e.id));for(const e of remoteList){if(!localIds.has(e.id))mergedList.push(e);}}
        }
      }catch(fetchErr){console.warn('Gist fetch for merge skipped:',fetchErr.message);}
    }
    invFiles['list.json']={content:JSON.stringify(mergedList)};
    // Step3: インボイスデータのみGist PATCH（写真は一切含まない）
    let data;
    if(gistId){
      data=await _gFetch('https://api.github.com/gists/'+gistId,{method:'PATCH',body:JSON.stringify({files:invFiles})});
    }else{
      data=await _gFetch('https://api.github.com/gists',{method:'POST',body:JSON.stringify({description:'MYKITA Osaka DC',public:false,files:invFiles})});
      localStorage.setItem(GK_ID,data.id);
    }
    localStorage.setItem(GK_AT,new Date().toISOString());
    _markClean();if(_invoiceSnap&&S.invoice)_invoiceSnap=JSON.stringify(S.invoice);_syncSt='ok';
    const finalId=gistId||data.id;
    const pushedInvCount=Object.keys(invFiles).filter(k=>k.startsWith('inv_')).length;
    _syncMsg='Push完了 (Gist: '+(finalId?finalId.slice(0,8)+'…':'new')+' / リスト: '+mergedList.length+'件 / invファイル: '+pushedInvCount+'個)';
    alert(_syncMsg);
  }catch(e){_syncSt='err';_syncMsg='Push失敗: '+e.message;alert('Push失敗: '+e.message);}
  S.pushing=false;render();setTimeout(()=>{if(_syncSt==='ok'){_syncSt=null;render();}},3000);
}

  const words=q?q.split(/\s+/).filter(Boolean):[];
  document.querySelectorAll('[data-pn-name]').forEach(el=>{
    const name=(el.dataset.pnName||'').toLowerCase();
    const id=(el.dataset.pnId||'').toLowerCase();
    el.style.display=(!words.length||words.every(w=>name.includes(w)||id.includes(w)))?'':'none';

}

  const k=no+'_'+idx;

function migrateItem(it){
  // migrate old flat structure → defects array
  if(!it.defects){
    const legacy={part:it.defPart||'',partOther:it.defPartOther||null,side:it.defSide||'',cond:it.defCond||[],condOther:it.defCondOther||null};
    const hasData=legacy.part||legacy.side||legacy.cond.length;
    return {stampNo:'', ...it, defects: hasData?[legacy]:[newDefect()]};
  }
  return {stampNo:'', ...it};
}
function registerInvoice(inv){
  const list=loadList();
  const dup=list.find(e=>!e.archived&&e.number===inv.number);
  if(dup){
    if(!confirm(`インボイス番号 "${inv.number}" は既にアクティブにあります。\n既存をアーカイブして続けますか？\n\nOK = 既存をアーカイブしてアップロード\nキャンセル = 中止`))return false;
    const dupIdx=list.findIndex(e=>e.id===dup.id);
    list[dupIdx].archived=true;
  }
  const id=genId();
  S.invoiceId=id;
  const tot=inv.items.length;
  const pend=inv.items.filter(i=>i.status==='pending').length;
  const createdAt=inv.createdAt||(S.uploadDate?new Date(S.uploadDate+'T00:00:00').toISOString():new Date().toISOString());
  list.unshift({id,number:inv.number,date:inv.date||'',createdAt,archived:false,tot,pend});
  saveList(list);
  _invsDirty=true;_dirty=true;
  try{localStorage.setItem('mykita_dc_inv_'+id,JSON.stringify(inv));}catch(e){console.warn('registerInvoice save failed:',e);}
}
function openInvoice(id,scrollToDef){
  try{
    const d=localStorage.getItem('mykita_dc_inv_'+id);
    if(!d)return;
    const inv=JSON.parse(d);
    inv.items=inv.items.map(migrateItem);
    _preEditDirty=_dirty; _preEditInvsDirty=_invsDirty; _invoiceSnap=JSON.stringify(inv);
    S.invoiceId=id; S.invoice=inv; S.screen='checklist';
    S.filter=scrollToDef?'DEF':'ALL'; S.tagFilter=[]; S.itemSearch=''; S.pickerOpen={}; S.showEmail=false;
    _forceScrollTop=true;
    render();
  }catch(e){console.warn('openInvoice failed:',e);}
}
function archiveInvoice(id){
  _sw.openId=null;
  const list=loadList();
  const idx=list.findIndex(e=>e.id===id);
  if(idx<0)return;
  if(list[idx].archived){
    const num=list[idx].number;
    if(list.some(e=>!e.archived&&e.number===num))alert('同名インボイスが存在するため、アーカイブからアクティブには戻せません。');
    else{list[idx].archived=false;saveList(list);render();}
    return;
  }
  list[idx].archived=true;
  saveList(list);
  render();
}
function deleteInvoice(id){
  _sw.openId=null;
  if(!confirm('このインボイスを削除しますか？\nこの操作は取り消せません。'))return;
  const list=loadList().filter(e=>e.id!==id);
  saveList(list);
  localStorage.removeItem('mykita_dc_inv_'+id);

  if(gPat()&&gId())_gFetch('https://api.github.com/gists/'+gId(),{method:'PATCH',body:JSON.stringify({files:{['inv_'+id+'.json']:null}})}).catch(e=>console.warn('Gist delete failed:',e));

}

async function _silentGistPush(){
  if(!gPat())return;
  try{
    const list=loadList();
    const gistId=gId();
    const invFiles={};
    list.forEach(e=>{const d=localStorage.getItem('mykita_dc_inv_'+e.id);if(d)invFiles['inv_'+e.id+'.json']={content:d};});
    let mergedList=[...list];
    if(gistId){
      try{
        const _cur=await _gFetch('https://api.github.com/gists/'+gistId+'?_t='+Date.now());
        const lf=_cur.files['list.json'];
        if(lf){
          const rc=lf.truncated?await fetch(lf.raw_url,{headers:{'Authorization':'token '+gPat()}}).then(r=>r.text()):lf.content;
          if(rc){const remoteList=JSON.parse(rc);const localIds=new Set(list.map(e=>e.id));for(const e of remoteList){if(!localIds.has(e.id))mergedList.push(e);}}
        }
      }catch(e){/* merge skip */}
    }
    invFiles['list.json']={content:JSON.stringify(mergedList)};
    if(gistId){await _gFetch('https://api.github.com/gists/'+gistId,{method:'PATCH',body:JSON.stringify({files:invFiles})});}
    else{const d=await _gFetch('https://api.github.com/gists',{method:'POST',body:JSON.stringify({description:'MYKITA Osaka DC',public:false,files:invFiles})});localStorage.setItem(GK_ID,d.id);}
    localStorage.setItem(GK_AT,new Date().toISOString());
    _markClean();if(_invoiceSnap&&S.invoice)_invoiceSnap=JSON.stringify(S.invoice);
  }catch(e){console.warn('Auto push failed:',e.message);}
}
async function toggleSent(id){
  _sw.openId=null;
  const list=loadList();
  const idx=list.findIndex(e=>e.id===id);
  if(idx<0)return;
  const cur=list[idx].sent;
  if(cur){
    if(!confirm('現在のフェーズ: ✈ SENT\n= DEFECTIVE REPORTメール送信済み\n\nOK = UNSENT（未送信）に戻す\nキャンセル = 中止'))return;
  }else{
    if(!confirm('現在のフェーズ: UNSENT\n= DEFECTIVE REPORTメール未送信\n\nOK = SENT（送信済み）に変更\nキャンセル = 中止'))return;
  }
  list[idx].sent=!cur;
  saveList(list);render();
  if(!cur){
    if(_simpleMode){
      _syncSt='push';_syncMsg='';render();
      await _silentGistPush();
      _syncSt='ok';_syncMsg='自動Push完了';render();
      setTimeout(()=>{if(_syncSt==='ok'){_syncSt=null;render();}},3000);
    }else{
      alert('DISPOSITION入力が可能になりました。\n担当者からのメール受信後に処理（Return/Sample）を入力してください。');
      requestAnimationFrame(()=>{
        const btn=document.getElementById('disp-btn-'+id);
        if(btn){btn.classList.add('disp-hop');setTimeout(()=>btn.classList.remove('disp-hop'),800);}
      });
    }
  }
}
function _checkPendingAndBuild(){
  if(!S.invoice)return;

/* PDF EXTRACTION */
async function handleReparseByNumber(f){
  if(!f)return;
  try{
    const buf=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){
      const pg=await pdf.getPage(i);
      const ct=await pg.getTextContent();
      const rows={};
      ct.items.forEach(item=>{const y=Math.round(item.transform[5]);if(!rows[y])rows[y]=[];rows[y].push({x:item.transform[4],t:item.str});});
      Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{const line=rows[y].sort((a,b)=>a.x-b.x).map(i=>i.t).join(' ').trim();if(line)text+=line+'\n';});
    }
    const newInv=parseMykita(text);
    if(!newInv||!newInv.items.length){alert('PDFを解析できませんでした。\n正しいMYKITA Proforma Invoice PDFか確認してください。');return;}
    // Find matching invoice by number
    const list=loadList();
    const match=list.find(e=>e.number===newInv.number);
    if(!match){alert('インボイス番号 "'+newInv.number+'" に一致するインボイスが見つかりません。');return;}
    const d=localStorage.getItem('mykita_dc_inv_'+match.id);
    if(!d){alert('インボイスデータが見つかりません');return;}
    const existing=JSON.parse(d);
    // Merge: update parsed fields, preserve user-entered data
    const KEEP=['status','remark','defects','stampNo','pn','disp','receiving','receivingDate','smDone','smDoneNote','photoTaken','itemId'];
    const existingByNo={};existing.items.forEach(it=>existingByNo[it.no]=it);
    const newByNo={};newInv.items.forEach(it=>newByNo[it.no]=it);
    const merged=newInv.items.map(nit=>{
      const ex=existingByNo[nit.no];if(!ex)return nit;
      const out={...nit};KEEP.forEach(k=>{if(k in ex)out[k]=ex[k];});return out;
    });
    existing.items.forEach(ex=>{if(!newByNo[ex.no])merged.push(ex);});
    const mergedInv={...newInv,items:merged};
    localStorage.setItem('mykita_dc_inv_'+match.id,JSON.stringify(mergedInv));
    const idx=list.findIndex(e=>e.id===match.id);
    if(idx>=0){
      const defs=merged.filter(i=>i.status==='defective');
      list[idx].tot=merged.length;list[idx].pend=merged.filter(i=>i.status==='pending').length;
      list[idx].number=mergedInv.number||list[idx].number;
      list[idx].dispTotal=defs.length;list[idx].dispSet=defs.filter(i=>i.disp).length;
      list[idx].receCount=defs.filter(i=>i.receiving).length;
      saveList(list);
    }
    _invsDirty=true;{const _ld=_listSnap!==null&&_listForSnap(loadList())!==_listSnap;_dirty=_ld||_invsDirty||!!_dispDirtyIds.size;}
    alert('再解析完了: '+newInv.number+'\n'+merged.length+'件のアイテムを更新しました\n\n変更を保存するにはPushしてください');
    render();
  }catch(e){alert('PDF読込エラー: '+e.message);}
}

/* MYKITA PROFORMA INVOICE PARSER
   Columns: Position Qty Unit Item# Description [ColorCode] CustRef Order# Delivery# [SUN/RX] [Material] HS-Code DE UnitPrice TotalPrice JPY */
function parseMykita(text){
  // Invoice number: "Proforma Invoice 5000003270" or "Invoice No. 5000003270"
  let number='';
  const nm=text.match(/(?:Proforma\s+Invoice|Invoice\s+No\.?)\s+(\d{7,12})/i);
  if(nm)number=nm[1];

  // Date: "Date 30.03.2026"
  let date='';
  const dm=text.match(/\bDate\s+(\d{1,2}\.\d{1,2}\.\d{4})/i);
  if(dm)date=dm[1];

  // Item lines: anchor on Delivery# (8-digit, e.g. 81299521) then HS-Code (8-digit), DE, prices, JPY
  // Columns: Position Qty Unit Item# [Description Color CustomerRef OrderNo] Delivery# [SUN/RX] [Material] HS-Code DE UnitPrice TotalPrice JPY
  const re=/^[ \t]*(\d{1,2})[ \t]+(\d+)[ \t]+(PC|PA)[ \t]+(\d{8})[ \t]+(.+?)[ \t]+(\d{8})[ \t]+(SUN[ \t]+|RX[ \t]+)?(?:metal[ \t]+|acetate[ \t]+|MYLON[ \t]+|plastic[ \t]+)?(\d{8})[ \t]+DE[ \t]+(\d+)[ \t]+\d+[ \t]+JPY/gm;
  // Pre-extract orphan model names: lines that contain only a MYKITA model name (separated from row data by pdfjs)
  const _orphans=[];
  {const _or=/^[ \t]*([A-Z]{2,}(?:\s+[A-Z0-9]+)?(?:[\-\/][A-Z0-9\/\-_]+)+_(?:RX|SUN)(?:\*)?)\s*$/gm;let _om;while((_om=_or.exec(text))!==null)_orphans.push({index:_om.index,name:_om[1].trim()});}
  const items=[];
  let m;
  while((m=re.exec(text))!==null){
    const pos=m[1],qty=m[2],unit=m[3],itemNo=m[4];
    let descRaw=m[5].trim();
    // If descRaw starts with a digit, model name may be an orphan line nearby in the text
    if(/^\d/.test(descRaw)&&_orphans.length){
      const nearest=_orphans.reduce((b,o)=>{const d=Math.abs(o.index-m.index);return d<b.dist?{name:o.name,dist:d}:b;},{name:null,dist:Infinity});
      if(nearest.name&&nearest.dist<500)descRaw=nearest.name+' '+descRaw;
    }
    // m[6]=delivery#, m[7]=SUN/RX column (undefined if blank), m[8]=HS-Code, m[9]=unitPrice (not stored)
    const sunRxCol=(m[7]||'').trim().toUpperCase();
    const hsCode=m[8],unitPrice='';
    // Category: HS code takes priority, then RX/SUN column; blank column → PARTS
    let cat;
    if(hsCode==='90039000')cat='parts';
    else if(hsCode==='90041091')cat='sun';
    else if(sunRxCol.startsWith('SUN'))cat='sun';
    else if(sunRxCol.startsWith('RX'))cat='rx';
    else cat='parts';  // RX/SUN列が空欄 → PARTS
    // Extract color code for non-parts items
    let name=descRaw,colorCode='';
    if(cat!=='parts'){
      // 1st priority: explicit "Color NNN" label from PDF
      const clm=descRaw.match(/\bColor\s+(\d{3})\b/i);
      if(clm){
        colorCode=clm[1];
        name=descRaw.replace(clm[0],'').replace(/\s{2,}/g,' ').trim();
      } else {
        // 2nd priority: C-prefixed code e.g. "C234"
        const cpm=descRaw.match(/\bC(\d{3})\b/);
        if(cpm){
          colorCode=cpm[1];
          name=descRaw.replace(cpm[0],'').replace(/\s{2,}/g,' ').trim();
        } else {
          // 3rd priority: leading 3-digit color code e.g. "556 Ms Giye 255644"
          const cld=descRaw.match(/^(\d{3})\s+([A-Za-z].*)$/);
          if(cld){
            colorCode=cld[1];
            name=cld[2].trim();
          } else {
            // Fallback: standalone 3-digit number at end of description
            const cm=descRaw.match(/^(.*?)\s+(\d{3})(?:\s+.*)?$/);
            if(cm&&!/^\d/.test(cm[1].trim())){name=cm[1].trim();colorCode=cm[2]}
          }
        }
      }
    } else {
      // For parts: strip everything from customer-reference keywords onward
      name=descRaw.replace(/\s+(def |wrong |NURIA |Shop |Personal |C\d{3}\s*\/|\/\s*).*/i,'').trim();
    }
    // Extract orderNo (6-7 digit standalone number) and custRef from descRaw
    let orderNo='',custRef='';
    {const onm=descRaw.match(/\b(\d{6,7})\b/);
     if(onm){orderNo=onm[1];
       let rem=descRaw.replace(orderNo,'');
       if(name)rem=rem.replace(name,'');
       if(colorCode){rem=rem.replace(new RegExp('(?:Color\\s+)?'+colorCode,'gi'),'').replace('C'+colorCode,'');}
       custRef=rem.replace(/[^a-zA-Z0-9\s]/g,'').replace(/\s{2,}/g,' ').trim().toLowerCase();
     }
    }
    // Strip orderNo from name if it leaked in during color extraction
    if(orderNo&&name.includes(orderNo)){name=name.replace(new RegExp('\\b'+orderNo+'\\b'),'').replace(/\s{2,}/g,' ').trim();}
    const qtyN=parseInt(qty)||1;
    if(qtyN<=1){
      items.push({no:pos,qty:'1',unit,itemNo,name,colorCode,cat,unitPrice,orderNo,custRef,status:'pending',remark:'',subOf:null,subIdx:0,subTotal:1,defects:[newDefect()],stampNo:'',photoTaken:false,itemId:''});
    } else {
      for(let si=1;si<=qtyN;si++){
        items.push({no:pos+'-'+si,qty:'1',unit,itemNo,name,colorCode,cat,unitPrice,orderNo,custRef,status:'pending',remark:'',subOf:pos,subIdx:si,subTotal:qtyN,defects:[newDefect()],stampNo:'',photoTaken:false,itemId:''});
      }
    }
  }
  return{number,date,items};
}

function cycle(no){
  if(checkArchived())return;
  let _newOkItem=null;
  let _okWarnItem=null;
  let _markedDefective=false;
  S.invoice.items=S.invoice.items.map(it=>{
    if(it.no!==no)return it;
    const prev=it.status;
    const i=CYCLE_STATS.indexOf(prev);
    const next=CYCLE_STATS[(i<0?0:i+1)%CYCLE_STATS.length];
    if(next==='defective'){
      S.pickerOpen[no]=true;
      _markedDefective=true;
    }else if(prev==='defective'){
      delete S.pickerOpen[no];
      const cleaned=it.defects.filter((d,idx)=>
        idx===0||d.part||d.partOther||d.side||d.cond.length||d.condOther
      );
      it=syncRemark({...it,defects:cleaned.length?cleaned:[it.defects[0]]});
    }
    if(next==='ok'&&it.orderNo)_newOkItem=it;
    if(next==='ok'&&(it.cat==='rx'||it.cat==='sun')&&_isWarnCustRef(it.custRef)&&!it.smDone)_okWarnItem=it;
    return{...it,status:next};
  });
  if(_okWarnItem)_promptSmDone(_okWarnItem.no,_okWarnItem.custRef);
  save();
  if(_newOkItem&&S.invoice.number)_autoSetRece([_newOkItem],S.invoice.number);
  if(_markedDefective&&_trainingMode&&!_firstDTrainShown){_firstDTrainShown=true;_trainPop={step:TRAIN_STEPS.firstD,cb:null};}
  render();
}

    return syncRemark({...it,defects:[newDefect()]});
  });
  save();render();
}
function syncRemark(it){
  const parts=it.defects.map(d=>{
    const partStr=d.part||(d.partOther||'');
    const detail=d.partDetail?` (${d.partDetail})`:'';
    const partDisplay=partStr+detail;
    const loc=partStr
      ?(d.side==='Both'&&partStr==='Lens'&&!d.partDetail?'Both lenses':
        d.side==='Both'&&partStr==='Temple'?'Both temples':
        d.side?d.side+' '+partDisplay.toLowerCase():partDisplay)
      :(d.side||'');
    const conds=[...d.cond,...(d.condOther?[d.condOther]:[])].map(c=>c==='Scratch'?'Scratches':c);
    return[loc,conds.join(', ')].filter(Boolean).join(' / ');
  }).filter(Boolean);
  return{...it,remark:parts.join(' | ')};
}

async function _initMsal(){
  // Singleton: reuse in-flight promise to avoid duplicate MSAL instances
  if(_msalInitPromise)return _msalInitPromise;
  _msalInitPromise=(async()=>{
    const clientId=getMsClientId();
    if(!clientId)return {ok:false,err:'Client IDが未設定です'};
    if(typeof msal==='undefined')return {ok:false,err:'MSALライブラリの読み込みに失敗しました。ネットワーク接続を確認してください'};
    try{
      const app=new msal.PublicClientApplication({
        auth:{clientId,authority:'https://login.microsoftonline.com/'+getMsTenantId(),redirectUri:location.origin+location.pathname},
        cache:{cacheLocation:'localStorage',storeAuthStateInCookie:false}
      });
      if(typeof app.initialize==='function')await app.initialize();
      _msalApp=app;
      const accs=_msalApp.getAllAccounts();
      if(accs.length)_msalAccount=accs[0];
      return {ok:true};
    }catch(e){console.error('MSAL init:',e);_msalInitPromise=null;return {ok:false,err:e.message||String(e)};}
  })();
  return _msalInitPromise;
}
async function msSignIn(){
  if(!getMsClientId()){alert('Client IDを設定してください（SET → Microsoft）');return;}
  // Wait for any in-flight init (started by initApp) before proceeding
  const initResult=await _initMsal();
  if(!initResult.ok){alert('MSALの初期化に失敗しました\n'+initResult.err);return;}
  // Preserve email modal state across the async popup (popup may take time)
  const _prevShowEmail=S.showEmail;
  const _prevInvoiceId=S.invoiceId;
  const _prevInvoice=S.invoice;
  try{
    const r=await _msalApp.loginPopup({scopes:['Mail.Send','User.Read'],prompt:'select_account'});
    _msalAccount=r.account||(_msalApp.getAllAccounts()[0]||null);
    // Restore email modal if it was open when sign-in was triggered
    if(_prevShowEmail&&_prevInvoice){
      S.showEmail=true;
      S.invoiceId=_prevInvoiceId;
      S.invoice=_prevInvoice;
    }
    render();
  }catch(e){if(e.errorCode!=='user_cancelled')alert('サインインエラー: '+(e.message||e.errorCode||e));}
}

async function _getMsToken(){
  if(!_msalApp||!_msalAccount)throw new Error('Microsoftにサインインしてください');
  try{

        list[idx].pend=inv.items.filter(i=>i.status==='pending').length;
        const defItems=inv.items.filter(i=>i.status==='defective');
        list[idx].dispTotal=defItems.length;
        list[idx].dispSet=defItems.filter(i=>i.pn).length;
        list[idx].receCount=defItems.filter(i=>i.receiving).length;
        localStorage.setItem(SK_LIST,JSON.stringify(list));
      }
    }catch(e){console.warn('discardAndLeave:',e);}
  }
  _invsDirty=_preEditInvsDirty;{const _ld=_listSnap!==null&&_listForSnap(loadList())!==_listSnap;_dirty=_ld||_invsDirty||!!_dispDirtyIds.size;}
  S.showLeavePrompt=false;
  resetApp();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/svg></div><div style="position:absolute;top:104px;left:110px;pointer-events:none;z-index:10;animation:guide-chk-cur4 12s ease-in-out infinite"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="18" viewBox="0 0 14 18" fill="none"><path d="M2 1L2 14L5.5 11L7.8 16.5L9.8 15.7L7.5 10.5H13.5L2 1Z" fill="#1a1a1a" stroke="white" stroke-width="1.5" stroke-linejoin="round"/></svg></div></div></div><div style="margin:10px 0 14px;padding:8px 10px;background:var(--g50);border-radius:6px;border-left:3px solid var(--g200)"><span style="font-size:11px;color:var(--g600)">D で入力した内容は、ステータスを <b>OK</b> や <b>—</b> に切り替えてもバックグラウンドで保持されています。再びDに戻した時には同じ内容で復帰できます。（記録を消去するには <b style="color:var(--redM)">× clear</b> を使用してください。）</span></div><div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px"><div style="display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:1px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="20" height="20"><rect x="1" y="7" width="22" height="14" rx="2.5" fill="none" stroke="#bbb" stroke-width="1.8"/><path d="M9 7V5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V7" fill="none" stroke="#bbb" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="14" r="3.8" fill="none" stroke="#bbb" stroke-width="1.8"/><circle cx="12" cy="14" r="1.4" fill="#bbb"/><line x1="3" y1="3" x2="21" y2="21" stroke="var(--red)" stroke-width="2" stroke-linecap="round"/></svg><span style="font-size:10px;color:var(--g400)">→</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="20" height="20"><rect x="1" y="7" width="22" height="14" rx="2.5" fill="var(--red)" stroke="var(--red)" stroke-width="1.8"/><path d="M9 7V5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V7" fill="var(--red)" stroke="var(--red)" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="14" r="3.8" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="14" r="1.4" fill="rgba(255,255,255,.55)"/><circle cx="21" cy="21" r="6" fill="#fff" stroke="var(--red)" stroke-width="1.5"/><path d="M18 21l2.2 2.2 3.5-3.5" stroke="var(--red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></div><span style="font-size:11px;color:var(--g600)">D アイテム行のカメラボタンで撮影状態を記録します。タップするたびに <b>未撮影 / 撮影済</b> が切り替わります。<br><span style="font-size:10px;color:var(--g400)">マークは撮影の有無を判別するためのもので、このアプリ内で画像は保存できません。指定デバイスのカメラ機能で撮影を行ってください。</span></span></div><b style="font-size:10px;letter-spacing:.5px;color:var(--blue)">Matched RPN</b><br><span style="font-size:11px;color:var(--g600)">DアイテムのRPN（交換品番号）が別インボイスの交換オーダーと一致すると表示されます。RPN SEARCHで処理状況を確認できます。</span><br><br><b style="font-size:10px;letter-spacing:.5px">入庫CSV対象</b><br><span style="font-size:11px;color:var(--g600)">RX・SUN カテゴリの <b>OK</b> アイテムが対象です。また Matched RPN の PARTS カテゴリ <b>OK</b> アイテムも含まれます。</span><div style="margin-top:8px;display:flex;flex-direction:column;gap:8px"><div><span style="display:inline-flex;align-items:center;font-size:9px;letter-spacing:.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;white-space:nowrap">INV で入庫</span><div style="margin-top:4px;font-size:11px;color:var(--g600)">表示されているインボイスの入庫CSVリストに追加されます。バッジの編集は ホーム → RPN SEARCH で行います。</div></div><div><span style="display:inline-flex;align-items:center;font-size:9px;letter-spacing:.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--amber);background:var(--amber);color:#fff;font-weight:600;white-space:nowrap">✓ 入庫CSVから除外</span><div style="margin-top:4px;font-size:11px;color:var(--g600)">入庫バッジをタップすることで切り替わり、入庫CSVリストから除外されます。CustRef が <b>def stock / shop breakage</b> の場合はスタンプ番号入力に進む際に自動で切り替えるか確認画面が表示されます。</div></div></div>`,

          ${['all','matched','unmatched'].map(v=>{const lbl=v==='all'?'ALL':v==='matched'?'Matched':'Non';const active=_pnMatchFilter===v;return `<button onclick="_pnMatchFilter='${v}';_pnPage=0;render()" style="flex:1;padding:6px 4px;border-radius:4px;border:1px solid ${active?'var(--blue)':'var(--g200)'};background:${active?'var(--blue)':'transparent'};color:${active?'#fff':'var(--g600)'};font-size:9px;letter-spacing:.5px;font-family:inherit;cursor:pointer;font-weight:${active?'700':'400'}">${lbl}</button>`;}).join('')}
        </div>
        <button onclick="_pnSortOrder=_pnSortOrder==='asc'?'desc':'asc';_pnPage=0;render()" style="flex-shrink:0;padding:6px 10px;border-radius:4px;border:1px solid var(--g200);background:transparent;color:var(--g600);font-size:9px;letter-spacing:.5px;font-family:inherit;cursor:pointer">${_pnSortOrder==='asc'?'↑ ASC':'↓ DESC'}</button>
        <button onclick="_pnHideDone=!_pnHideDone;_pnPage=0;render()" style="flex-shrink:0;padding:6px 10px;border-radius:4px;border:1px solid ${_pnHideDone?'var(--teal)':'var(--g200)'};background:${_pnHideDone?'var(--teal)':'transparent'};color:${_pnHideDone?'#fff':'var(--g600)'};font-size:9px;letter-spacing:.5px;font-family:inherit;cursor:pointer;font-weight:${_pnHideDone?'700':'400'}">完了除外</button>
      </div>
      <div style="font-size:9px;letter-spacing:1px;color:var(--g400);margin-bottom:6px">${_filteredVisible.length}件${(_hasFilter||_pnHideDone)?' / '+_defItems.length+'件中':''}${_totalPages>1?` — ${_curPage+1}/${_totalPages}ページ`:''}</div>
      ${_totalPages>1?`<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--g100)">
        <button onclick="_pnPage=${Math.max(0,_curPage-1)};render()" ${_curPage===0?'disabled':''} style="padding:5px 14px;border-radius:4px;border:1px solid var(--g200);background:transparent;color:${_curPage===0?'var(--g300)':'var(--g600)'};font-size:11px;cursor:${_curPage===0?'default':'pointer'};font-family:inherit">‹ 前へ</button>
        <span style="font-size:10px;color:var(--g500)">${_curPage+1} / ${_totalPages}</span>
        <button onclick="_pnPage=${Math.min(_totalPages-1,_curPage+1)};render()" ${_curPage>=_totalPages-1?'disabled':''} style="padding:5px 14px;border-radius:4px;border:1px solid var(--g200);background:transparent;color:${_curPage>=_totalPages-1?'var(--g300)':'var(--g600)'};font-size:11px;cursor:${_curPage>=_totalPages-1?'default':'pointer'};font-family:inherit">次へ ›</button>
      </div>`:''}
      ${_defItems.length===0
        ?'<div style="text-align:center;padding:30px;font-size:11px;color:var(--g400)">RPNが入力されたDEFアイテムがありません</div>'
        :_filteredVisible.length===0
          ?'<div style="text-align:center;padding:20px;font-size:11px;color:var(--g400)">該当なし</div>'
          :rows.join('')}
      ${_totalPages>1?`<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--g100)">
        <button onclick="_pnPage=${Math.max(0,_curPage-1)};render()" ${_curPage===0?'disabled':''} style="padding:5px 14px;border-radius:4px;border:1px solid var(--g200);background:transparent;color:${_curPage===0?'var(--g300)':'var(--g600)'};font-size:11px;cursor:${_curPage===0?'default':'pointer'};font-family:inherit">‹ 前へ</button>
        <span style="font-size:10px;color:var(--g500)">${_curPage+1} / ${_totalPages}</span>
        <button onclick="_pnPage=${Math.min(_totalPages-1,_curPage+1)};render()" ${_curPage>=_totalPages-1?'disabled':''} style="padding:5px 14px;border-radius:4px;border:1px solid var(--g200);background:transparent;color:${_curPage>=_totalPages-1?'var(--g300)':'var(--g600)'};font-size:11px;cursor:${_curPage>=_totalPages-1?'default':'pointer'};font-family:inherit">次へ ›</button>
      </div>`:''}
      ${(()=>{
        const _putInStockPending=_defItems.filter(({it,invId})=>{
          const _proc=buildProcessChain(invId,it.no);
          const _done=_proc&&_proc.steps.length>0&&['ok','ok_receiving'].includes(_proc.steps[_proc.steps.length-1].type);
          return _done&&!it.receiving;
        });
        return _putInStockPending.length>0?`<div style="margin-top:16px;padding:12px 0 0;border-top:1px solid var(--g100)">
          <div style="font-size:9px;letter-spacing:1px;color:var(--teal);margin-bottom:8px">PUT IN STOCK — RECE未設定 ${_putInStockPending.length}件</div>
          <button class="btn out" style="margin-top:0;border-color:var(--teal);color:var(--teal)" onclick="autoFillPutInStockRece()">Put in stock を一括RECE補完</button>
        </div>`:'';
      })()}
      ${_defItems.length>0?`<div style="margin-top:12px"><button class="btn blk" style="margin-top:0;opacity:${Object.keys(_pnListChanges).length>0?1:0.35}" onclick="savePnListChanges()">DONE</button></div>`:''}
      <button id="pn-scroll-fab" onclick="(function(){const s=document.getElementById('pn-list-sheet');if(!s)return;const atBottom=s.scrollHeight-s.scrollTop-s.clientHeight<40;s.scrollTo({top:atBottom?0:s.scrollHeight,behavior:'smooth'});})()" style="position:sticky;bottom:16px;left:calc(100% - 48px);display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:none;background:var(--k);color:var(--w);font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:10;margin-top:8px;float:right">↓</button>
    </div>
  </div>`;
})()}${xlsxSelSheet}${csvSelSheet}${csvPickerSheet}${settingsSheet}${pickerBackdrop}${guideModal}${_trainPop?(()=>{const{step}=_trainPop;return`<div class="overlay" style="z-index:800;align-items:center;justify-content:center"><div class="sheet" style="border-radius:14px;padding:0;overflow:hidden;max-width:360px;width:calc(100% - 40px)"><div style="background:var(--blue);padding:20px 20px 16px;color:#fff"><div style="font-size:9px;letter-spacing:2px;opacity:.75;margin-bottom:6px">STEP ${step.no} / ${step.of} — STEP UP MODE</div><div style="font-size:26px;margin-bottom:8px">${step.icon}</div><div style="font-size:16px;font-weight:700;letter-spacing:.3px;line-height:1.3">${step.title}</div></div><div style="padding:18px 20px 14px;font-size:13px;color:var(--g700);line-height:1.75">${step.body}</div><div style="padding:0 20px 20px;display:flex;flex-direction:column;gap:8px"><button onclick="_trainOk()" style="width:100%;padding:13px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.3px">${step.btnLabel||'実行する →'}</button><button onclick="_trainPop=null;render()" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--g200);background:transparent;color:var(--g500);font-size:12px;cursor:pointer;font-family:inherit">スキップ</button></div></div></div>`})():''}${S.pushing?`
  <div style="position:fixed;inset:0;z-index:600;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px">
    <svg class="glass-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 28" width="80" height="28">
      <path d="M1 6 L8 11" stroke="#000" stroke-width="2" stroke-linecap="round" fill="none"/>
      <rect x="8" y="2" width="26" height="23" rx="7" stroke="#000" stroke-width="2.2" fill="none"/>
      <path d="M34 13 C37 8 43 8 46 13" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="46" y="2" width="26" height="23" rx="7" stroke="#000" stroke-width="2.2" fill="none"/>
      <path d="M72 11 L79 6" stroke="#000" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
    <div style="width:180px"><div class="lbar" style="margin:0"><div class="lfill"></div></div></div>
    <div style="font-size:10px;letter-spacing:3px;color:var(--g600)">PUSH中...</div>
  </div>`:''} ${S.showLeavePrompt?`
  <div class="overlay" onclick="if(event.target===this)stayOnChecklist()">
    <div class="sheet">
      <div class="sheet-tit">チェックリストを離れますか？</div>
      <div style="font-size:12px;color:var(--g600);margin-bottom:20px;line-height:1.7">未送信の変更があります。</div>
      ${gPat()&&gId()?`<button class="btn blk" style="margin-top:0;margin-bottom:10px" onclick="pushAndLeave()">↑ Push して戻る</button>`:''}
      ${_invoiceSnap?`<button class="btn out" style="margin-top:0;margin-bottom:10px;color:var(--red);border-color:var(--redM)" onclick="discardAndLeave()">変更を破棄して戻る</button>`:''}
      <button class="btn out" style="margin-top:0" onclick="stayOnChecklist()">このまま続ける</button>
    </div>
  </div>`:''}
${(()=>{
  if(!_processModal)return '';
  const _chain=buildProcessChain(_processModal.invId,_processModal.no);
  if(!_chain)return '';
  const{steps,title}=_chain;
  const _defs={
    order:        {icon:'📦',label:'ORDER',          color:'var(--g700)'},
    delivery:     {icon:'📦',label:'REPLACEMENT',     color:'var(--g700)'},
    defective:    {icon:'🔴',label:'DEFECTIVE',      color:'var(--red)'},
    pn:           {icon:'🏷', label:'RPN REGISTERED', color:'var(--blue)'},
    ok_receiving: {icon:'✅', label:'OK (RECEIVING)', color:'var(--teal)'},
    ok:           {icon:'✅', label:'OK',             color:'var(--teal)'},
    pending:      {icon:'⏳', label:'PENDING',        color:'var(--amber)'},
  };
  const html=steps.map((s,i)=>{
    const d=_defs[s.type]||{icon:'·',label:s.type,color:'var(--g400)'};
    const _label=(s.type==='defective'&&s.missing)?'DEFECTIVE (MISSING)':d.label;
    const isLast=i===steps.length-1;
    let sub='';
    if(s.type==='order'||s.type==='delivery'){sub=`${s.invNumber} · ${(s.cat||'').toUpperCase()} · pos ${s.no}`;}
    else if(s.type==='pn'){sub=s.pn;}
    else if(s.type==='ok_receiving'){sub=s.invNumber?`INV ${esc(s.invNumber)}`:'';}
    const delay=i*150;
    return `<div class="proc-step" style="animation-delay:${delay}ms">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
          <div style="width:28px;height:28px;border-radius:50%;background:${d.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px">${d.icon}</div>
          ${!isLast?`<div class="proc-conn" style="animation-delay:${delay+180}ms"></div>`:''}
        </div>
        <div style="padding:5px 0">
          <div style="font-size:9px;letter-spacing:1.5px;font-weight:700;color:${d.color}">${_label}</div>
          ${sub?`<div style="font-size:11px;color:var(--g500);margin-top:1px;font-family:${s.type==='pn'?'monospace':'inherit'}">${sub}</div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="overlay" onclick="if(event.target===this){_processModal=null;render()}" style="z-index:300">
    <div class="sheet">
      <div class="sheet-tit">PROCESS<button class="close-btn" onclick="_processModal=null;render()">×</button></div>
      <div style="font-size:12px;font-weight:600;color:var(--k);margin-bottom:16px">${esc(title)}</div>
      ${html}
    </div>
  </div>`;
})()}
    `;
  const _hasModal=!!_dispSheet||_pnListOpen||!!_processModal||S.showSettings||S.showEmail||!!_recDatePicker||S.showXlsxSel||S.showCsvSel||S.showCsvPicker||S.showLeavePrompt||!!_trainPop;
  document.body.style.overflow=_hasModal?'hidden':'';
  requestAnimationFrame(()=>{
    if(_scrollToDef){_scrollToDef=false;setTimeout(()=>{const _ds=document.getElementById('def-sum');if(_ds){const _top=_ds.getBoundingClientRect().top+window.scrollY-60;window.scrollTo({top:_top,behavior:'smooth'});}},80);}else if(_forceScrollTop){_forceScrollTop=false;window.scrollTo(0,0);}
    else if(_scrollToInvId){const _el=document.querySelector(`.inv-swipe-wrap[data-id="${_scrollToInvId}"]`);if(_el){_el.scrollIntoView({block:'center'});}else{window.scrollTo(0,_sy);}_scrollToInvId=null;}
    else{window.scrollTo(0,_sy);}
    const _pnS=document.getElementById('pn-list-sheet');if(_pnS)_pnS.scrollTop=_pnSy;
  });
  if(_focId){const el=document.getElementById(_focId);if(el){el.focus();if(_focSS!=null&&el.setSelectionRange)try{el.setSelectionRange(_focSS,_focSE!=null?_focSE:_focSS);}catch(e){}}}
  _applyItemSearch();_applyPnNameSearch();_applyHomeItemSearch();
  const fab=document.getElementById('scroll-fab');
  if(fab){
    fab.style.display=((S.screen==='checklist'||S.screen==='stamp')&&!S.showEmail)?'flex':'none';
    updateFab();
  }
}

localStorage.removeItem('mykita_dc_dirty'); // clean up legacy persisted dirty flag
initApp();
_listSnap=_listForSnap(loadList());
(()=>{
  const list=loadList().filter(e=>!e.archived);
  if(list.length<=1)return;
  const newest=list.slice().sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''))[0];
  list.forEach(e=>{if(e.id!==newest.id)_smCollapsed.add(e.id);});
})();
render(); gistAutoSync();

function fabAtBottom(){const sh=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);return window.innerHeight+window.scrollY>=sh-20;}
function fabTap(){
  const fab=document.getElementById('scroll-fab');
  if(fabAtBottom()){
    window.scrollTo({top:0,behavior:'smooth'});
  } else {
    window.scrollTo({top:Math.max(document.body.scrollHeight,document.documentElement.scrollHeight),behavior:'smooth'});
  }
}
function updateFab(){
  const fab=document.getElementById('scroll-fab');
  if(!fab||fab.style.display==='none')return;
  fab.textContent=fabAtBottom()?'↑':'↓';
}
window.addEventListener('scroll',updateFab,{passive:true});

// iOS-safe outside-tap detection for picker close
// Pickers are closed only by pressing D again (cycle away from defective),
// not by outside tap. Screen transitions reset S.pickerOpen via openInvoice/resetApp.


/* ── 閉じる前にPush確認 / バックグラウンド時に自動Push / フォアグラウンド時に自動Pull ── */
window.addEventListener('beforeunload',e=>{
  if(_dirty&&gPat()&&gId()){e.preventDefault();e.returnValue='';}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    if(_dirty&&gPat()&&gId())gistPush().catch(()=>{});
  }else if(document.visibilityState==='visible'){
    if(S.screen==='home'&&gPat()&&gId()&&!_gistPulling&&!S.pushing){
      gistAutoSync();
    }
  }
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){
    e.preventDefault();
    if(S.pushing)return;
    if(!gPat()||!gId()){alert('TokenとGist IDを設定してください');return;}
    if(confirm('Push しますか？')){gistPush();}
  }
});
</script>
</body>
</html>
