name: Auto-merge to main

on:
  push:
    branches:
      - claude/auto-merge-to-main-5loZU

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff origin/claude/auto-merge-to-main-5loZU -m "Auto-merge claude/auto-merge-to-main-5loZU into main"
          git push origin main
